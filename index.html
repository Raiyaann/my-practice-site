<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My GitHub Practice Page</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid #2ea44f;
        }
        h1 { color: #333; margin-top: 1rem; }
        p { color: #666; margin-bottom: 2rem; }
        .links a {
            display: block;
            background-color: #2ea44f;
            color: white;
            padding: 12px;
            margin: 10px 0;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: transform 0.2s, background-color 0.2s;
        }
        .links a:hover {
            background-color: #2c974b;
            transform: scale(1.03);
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png" alt="Profile Picture">
        
        <h1>Mission Accomplished!</h1>
        <p>If you are seeing this, your GitHub Pages site is officially live.</p>

        <div class="links">
            <a href="https://github.com" target="_blank">My GitHub Profile</a>
            <a href="#" onclick="alert('Great job on your first deploy!')">Click for a Surprise</a>
            <a href="https://docs.github.com/en/pages" target="_blank">GitHub Pages Docs</a>
        </div>
    </div>

</body>
</html>
